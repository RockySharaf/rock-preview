name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Anything.sln -c Release

      - name: Test
        shell: pwsh
        run: |
          # A test that misses a timing bound on a busy shared runner is run once more on its own (and named in a warning);
          # a real failure fails both times. More than 10 failures, or a run that crashed, isn't tried again.
          dotnet test tests/Anything.Tests -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=first.trx" --results-directory TestResults
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $trx = Get-ChildItem TestResults -Recurse -Filter first.trx | Select-Object -First 1
          if (-not $trx) { exit 1 }
          [xml]$results = Get-Content $trx.FullName
          # A run that was aborted (the test host crashed) isn't tried again: the tests it never ran would pass unseen. (A
          # failed test's own [FAIL] line is a RunInfo with outcome Error too, so that alone says nothing.)
          $summary = $results.TestRun.ResultSummary
          $aborted = $summary.outcome -eq 'Aborted' -or [int]$summary.Counters.aborted -gt 0 -or
            @($results.TestRun.Results.UnitTestResult).Count -lt [int]$summary.Counters.total -or
            @($summary.RunInfos.RunInfo | Where-Object { "$($_.Text)" -match 'test run was aborted|host process crashed' }).Count -gt 0
          if ($aborted) { exit 1 }
          $failed = @($results.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } |
            ForEach-Object { $_.testName -replace '\(.*$', '' } | Sort-Object -Unique)
          if ($failed.Count -eq 0 -or $failed.Count -gt 10) { exit 1 }
          Write-Host "::warning title=Tests run again::Failed once, run again on their own: $($failed -join ', ')"
          $filter = ($failed | ForEach-Object { "FullyQualifiedName=$_" }) -join '|'
          dotnet test tests/Anything.Tests -c Release --no-build --logger "console;verbosity=normal" --filter $filter
          exit $LASTEXITCODE

      - name: Publish single-file builds
        shell: pwsh
        run: ./build/Publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: rock-preview-win-x64
          path: |
            dist/RockPreview-Setup.exe
            dist/RockPreview.exe
          retention-days: 14
